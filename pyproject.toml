[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudtips"
version = "0.3.1"
description = "Неофициальная Python-библиотека для CloudTips (получение донатов, поллинг, обновление токенов)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
]
keywords = ["cloudtips", "donations", "tips", "api", "payments"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Repository = "https://github.com/IRRatium/cloudtips-api"
Issues = "https://github.com/IRRatium/cloudtips-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["cloudtips"]
